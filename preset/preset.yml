schema_version: "1.0"

preset:
  id: landspec
  name: "landspec"
  version: "2.9.0"
  description: "Constitution with level-sized defaults, and tasks sized as one reviewable vertical slice each"
  author: iamalisson
  repository: https://github.com/iamalisson/landspec
  license: MIT

requires:
  speckit_version: ">=1.2.0"

provides:
  templates:
    - type: template
      name: constitution-template
      file: templates/constitution-template.md
      description: "Constitution with a generated defaults block per complexity level"
      replaces: constitution-template
    - type: template
      name: tasks-template
      file: templates/tasks-template.md
      description: "Tasks sized as one reviewable vertical slice, with Comes from / Completed when"
      replaces: tasks-template
    - type: command
      name: speckit.implement
      file: commands/speckit.implement.md
      description: "Appended to implement: builds the feature as /landspec:implement does; only implement.sh land ticks [X]"
      strategy: append

tags: ["best-practices", "github", "workflow"]
