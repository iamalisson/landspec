installed:
- landspec
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: landspec
    command: speckit.landspec.branch
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.branch?
    description: Make the feature's branch and commit the spec on it
    condition: null
  after_tasks:
  - extension: landspec
    command: speckit.landspec.plan-review
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.plan-review?
    description: Review the plan once and commit the spec folder on the feature branch
    condition: null
  after_converge:
  - extension: landspec
    command: speckit.landspec.plan-review
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.plan-review?
    description: Review the tasks /speckit-converge added and commit them on the feature branch
    condition: null
  after_analyze:
  - extension: landspec
    command: speckit.landspec.analyzed
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.analyzed?
    description: Record that analysis ran (required on level full)
    condition: null
  before_implement:
  - extension: landspec
    command: speckit.landspec.branch
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.branch?
    description: Switch to the task's branch
    condition: null
  after_implement:
  - extension: landspec
    command: speckit.landspec.pr
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.landspec.pr?
    description: Open the task's pull request
    condition: null
